<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LPGas.bd — Find Nearest LPG Gas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    @media (max-width: 600px) {
      .header { padding: 12px 15px; }
      .logo { font-size: 18px; }
      .header-btns a { font-size: 12px; padding: 6px 10px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="#" onclick="return false;" class="logo" id="mainLogo" style="text-decoration: none; color: white; cursor: pointer;">
      <i class="fa-solid fa-fire"></i> LPGas<span>.bd</span>
    </a>
    <div class="header-btns">
      <a href="partner-login.html"><i class="fa-solid fa-store"></i> Partner Login</a>
    </div>
  </header>

  <section class="hero">
    <h1>Find LPG Gas Near You</h1>
    <p>Book your cylinder from trusted partners in your area</p>
    <div class="search-box">
      <i class="fa-solid fa-location-dot"></i>
      <input type="text" id="searchArea" placeholder="Enter your area (e.g., Dhanmondi)">
      <button onclick="searchDealers()" id="nearMeBtn">Near Me</button>
    </div>
  </section>

  <div class="container">
    <h2 class="section-title"><i class="fa-solid fa-store" style="color:#cc0000"></i> Available Partners Nearby</h2>
    <div id="dealerList"><p style="text-align:center; color:#888;">লোড হচ্ছে...</p></div>
  </div>

  <script type="module">
    import { db } from './assets/js/firebase-config.js';
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    let allPartners = [];
    const dealerListEl = document.getElementById('dealerList');

    async function loadRealPartners() {
      try {
        const snapshot = await getDocs(collection(db, "users"));
        allPartners = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).filter(p => p.partnerId);
        renderDealers(allPartners);
      } catch (error) {
        dealerListEl.innerHTML = `<p style="text-align:center; color:red;">ডেটা লোড করতে সমস্যা হয়েছে।</p>`;
      }
    }

    function renderDealers(dealers) {
      if (dealers.length === 0) {
        dealerListEl.innerHTML = `<p style="text-align:center; color:#888; margin-top:20px;">কোনো পার্টনার পাওয়া যায়নি।</p>`;
        return;
      }
      
      dealerListEl.innerHTML = dealers.map(dealer => {
        let brandsHtml = '';
        if(dealer.brands && dealer.brands.length > 0) {
          brandsHtml = dealer.brands.map(b => {
            let prices = [];
            if(b.price12) prices.push(`১২কেজি: ৳${b.price12}`);
            if(b.price25) prices.push(`২৫কেজি: ৳${b.price25}`);
            return `<div style="font-size: 13px; margin-bottom: 5px;">
              <i class="fa-solid fa-tags" style="color:#0066cc"></i> <strong>${b.name}</strong>: ${prices.join(' | ')}
            </div>`;
          }).join('');
        } else {
          brandsHtml = '<span style="font-size:12px; color:#888;">দাম আপডেট করা হয়নি</span>';
        }

        return `
        <div class="dealer-card">
          <div class="dealer-header">
            <div class="dealer-name">${dealer.shopName || 'New Partner'}</div>
            <div class="dealer-dist" style="background:#e6f0fa; color:#0066cc; font-size:11px;">${dealer.thana || ''}, ${dealer.district || ''}</div>
          </div>
          <div class="dealer-info">
            <span><i class="fa-solid fa-phone"></i> ${dealer.phone || 'Phone not set'}</span>
          </div>
          <div class="dealer-price" style="margin-bottom: 15px; background: #f8f9fa; padding: 10px; border-radius: 8px;">
            <p style="font-size: 11px; color: #cc0000; margin-bottom: 5px; font-weight: 700;">* দাম সার্ভিস চার্জ সহ</p>
            ${brandsHtml}
          </div>
          <div class="btn-group">
            <button class="btn-order" onclick="goToOrder('${dealer.partnerId}')"><i class="fa-solid fa-bag-shopping"></i> Order Now</button>
            <button class="btn-wa" onclick="contactWhatsApp('${dealer.shopName}')"><i class="fa-brands fa-whatsapp"></i> WhatsApp</button>
          </div>
        </div>
      `;
      }).join('');
    }

    // WhatsApp বাটনের ফাংশন (আপনার নাম্বারে যাবে)
    window.contactWhatsApp = function(shopName) {
      const adminNumber = "8801917080000"; // আপনার নাম্বার
      const msg = encodeURIComponent(`Hi LPGas.bd, I want to know more about the partner: ${shopName}. Please help me.`);
      window.open(`https://wa.me/${adminNumber}?text=${msg}`, '_blank');
    };

    window.searchDealers = function() {
      const area = document.getElementById('searchArea').value.toLowerCase();
      if(!area) { renderDealers(allPartners); return; }
      const filtered = allPartners.filter(d => 
        (d.district || '').toLowerCase().includes(area) || 
        (d.thana || '').toLowerCase().includes(area)
      );
      renderDealers(filtered);
    };

    window.goToOrder = function(id) { 
      if(!id || id === 'undefined') { alert("এই পার্টনারের আইডি সেট করা নেই।"); return; }
      window.location.href = `order.html?partnerId=${id}`; 
    };

    loadRealPartners();

    // ৫ বার ক্লিকে অ্যাডমিন প্যানেল
    let clickCount = 0;
    let clickTimer;
    document.getElementById('mainLogo').addEventListener('click', function(e) {
      e.preventDefault();
      clickCount++;
      clearTimeout(clickTimer);
      clickTimer = setTimeout(() => { clickCount = 0; }, 1000); 
      if (clickCount === 5) { window.location.href = "admin.html"; clickCount = 0; }
    });
  </script>
</body>
</html>
