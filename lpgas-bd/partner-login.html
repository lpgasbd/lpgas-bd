<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner Login — LPGas.bd</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .login-container { background: white; max-width: 400px; margin: 40px auto; padding: 30px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #eee; text-align: center; }
    .login-container h2 { color: #cc0000; margin-bottom: 10px; font-size: 24px; }
    .login-container p { color: #666; font-size: 14px; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; color: #333; }
    .form-group input { width: 100%; padding: 12px; border: 1.5px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; font-family: 'Inter', sans-serif; }
    .form-group input:focus { border-color: #cc0000; }
    .btn-submit { width: 100%; background: #cc0000; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 800; font-size: 16px; cursor: pointer; margin-top: 10px; }
    .error-msg { color: #d9534f; font-size: 13px; margin-bottom: 10px; display: none; }
  </style>
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo" style="text-decoration: none; color: white;"><i class="fa-solid fa-fire"></i> LPGas<span>.bd</span></a>
  </header>

  <div class="login-container">
    <h2><i class="fa-solid fa-store"></i> Partner Login</h2>
    <p>লগইন করে আপনার অর্ডারগুলো দেখুন</p>
    
    <div id="errorMsg" class="error-msg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>ইমেইল (Email)</label>
        <input type="email" id="email" placeholder="partner@lpgas.com" required>
      </div>
      <div class="form-group">
        <label>পাসওয়ার্ড (Password)</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">লগইন করুন</button>
    </form>
  </div>

  <script type="module">
    import { auth } from './assets/js/firebase-config.js';
    import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    onAuthStateChanged(auth, (user) => {
      if (user) { window.location.href = "partner-dashboard.html"; }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');
      const errDiv = document.getElementById('errorMsg');

      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> লগইন হচ্ছে...';
      btn.disabled = true;
      errDiv.style.display = 'none';

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "partner-dashboard.html";
      } catch (error) {
        errDiv.innerText = "লগইন ব্যর্থ হয়েছে! ইমেইল বা পাসওয়ার্ড চেক করুন।";
        errDiv.style.display = 'block';
        btn.innerHTML = 'লগইন করুন';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
