<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner Access — LPGas.bd</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .login-container { background: white; max-width: 400px; margin: 40px auto; padding: 30px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #eee; text-align: center; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; color: #333; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border: 1.5px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; }
    .search-input { margin-bottom: 5px !important; background: #f8f9fa; border-color: #0066cc !important; }
    .btn-submit { width: 100%; background: #cc0000; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 800; font-size: 16px; cursor: pointer; margin-top: 10px; }
    .toggle-link { color: #0066cc; cursor: pointer; font-weight: 700; font-size: 14px; margin-top: 15px; display: block; }
    .signup-fields { display: none; }
  </style>
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo" style="text-decoration: none; color: white;"><i class="fa-solid fa-fire"></i> LPGas<span>.bd</span></a>
  </header>

  <div class="login-container">
    <h2 id="formTitle" style="color: #cc0000; margin-bottom: 15px;"><i class="fa-solid fa-store"></i> Partner Login</h2>
    <div id="errorMsg" style="color: red; font-size: 13px; margin-bottom: 10px; display: none;"></div>

    <form id="authForm">
      <div class="form-group">
        <label>ইমেইল (Email)</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label>পাসওয়ার্ড (Password)</label>
        <input type="password" id="password" required minlength="6">
      </div>
      
      <!-- সাইন আপের সময় এই ফিল্ডগুলো দেখাবে -->
      <div class="signup-fields" id="signupFields">
        <div class="form-group">
          <label>ফোন নাম্বার (Phone)</label>
          <input type="tel" id="regPhone" placeholder="017XXXXXXXX">
        </div>
        
        <div class="form-group">
          <label>জেলা (District)</label>
          <input type="text" id="regDistrictSearch" class="search-input" placeholder="🔍 জেলা খুঁজুন (যেমন: Dhaka)">
          <select id="regDistrict" onchange="loadThanas('regDistrict', 'regThana')">
            <option value="">জেলা সিলেক্ট করুন</option>
          </select>
        </div>
        
        <div class="form-group">
          <label>থানা (Thana)</label>
          <input type="text" id="regThanaSearch" class="search-input" placeholder="🔍 থানা খুঁজুন">
          <select id="regThana">
            <option value="">আগে জেলা সিলেক্ট করুন</option>
          </select>
        </div>
        
        <div class="form-group">
          <label>পার্টনার আইডি (Admin দিবে)</label>
          <input type="text" id="regPartnerId" placeholder="যেমন: 1">
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">লগইন করুন</button>
    </form>

    <span class="toggle-link" id="toggleAuth">নতুন পার্টনার? এখানে রেজিস্ট্রেশন করুন</span>
  </div>

  <script type="module">
    import { auth, db } from './assets/js/firebase-config.js';
    import { signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    let isSignup = false;
    let locationData = {};
    let allDistricts = [];

    // জেলা লোড করা
    fetch('./assets/js/bd-locations.json')
      .then(res => res.json())
      .then(data => {
        locationData = data;
        allDistricts = Object.keys(data).sort(); // A-Z সাজানো
        renderDistricts(allDistricts);
      });

    function renderDistricts(districts) {
      const distSelect = document.getElementById('regDistrict');
      distSelect.innerHTML = '<option value="">জেলা সিলেক্ট করুন</option>';
      districts.forEach(district => {
        distSelect.innerHTML += `<option value="${district}">${district}</option>`;
      });
    }

    // জেলা সার্চ
    document.getElementById('regDistrictSearch').addEventListener('input', (e) => {
      const val = e.target.value.toLowerCase();
      const filtered = allDistricts.filter(d => d.toLowerCase().includes(val));
      renderDistricts(filtered);
    });

    // থানা সার্চ
    document.getElementById('regThanaSearch').addEventListener('input', (e) => {
      const val = e.target.value.toLowerCase();
      const district = document.getElementById('regDistrict').value;
      if (!district) return;
      
      const thanaSelect = document.getElementById('regThana');
      const allThanas = locationData[district] || [];
      const filtered = allThanas.filter(t => t.toLowerCase().includes(val));
      
      thanaSelect.innerHTML = '<option value="">থানা সিলেক্ট করুন</option>';
      filtered.forEach(t => { thanaSelect.innerHTML += `<option value="${t}">${t}</option>`; });
    });

    // জেলা সিলেক্ট করলে থানা লোড হবে
    window.loadThanas = function(districtId, thanaId) {
      const district = document.getElementById(districtId).value;
      const thanaSelect = document.getElementById(thanaId);
      thanaSelect.innerHTML = '<option value="">থানা সিলেক্ট করুন</option>';
      
      if (district && locationData[district]) {
        locationData[district].sort().forEach(thana => {
          thanaSelect.innerHTML += `<option value="${thana}">${thana}</option>`;
        });
      }
    };

    onAuthStateChanged(auth, (user) => {
      if (user && !isSignup) { window.location.href = "partner-dashboard.html"; }
    });

    document.getElementById('toggleAuth').addEventListener('click', () => {
      isSignup = !isSignup;
      document.getElementById('formTitle').innerHTML = isSignup ? '<i class="fa-solid fa-user-plus"></i> Partner Sign Up' : '<i class="fa-solid fa-store"></i> Partner Login';
      document.getElementById('submitBtn').innerText = isSignup ? 'রেজিস্ট্রেশন করুন' : 'লগইন করুন';
      document.getElementById('signupFields').style.display = isSignup ? 'block' : 'none';
      document.getElementById('toggleAuth').innerText = isSignup ? 'আগে থেকেই অ্যাকাউন্ট আছে? লগইন করুন' : 'নতুন পার্টনার? এখানে রেজিস্ট্রেশন করুন';
      document.getElementById('errorMsg').style.display = 'none';
    });

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');
      const errDiv = document.getElementById('errorMsg');

      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> প্রসেস হচ্ছে...';
      btn.disabled = true;

      try {
        if (isSignup) {
          const district = document.getElementById('regDistrict').value;
          const thana = document.getElementById('regThana').value;
          if(!district || !thana) { alert("জেলা ও থানা সিলেক্ট করা বাধ্যতামূলক!"); btn.disabled=false; btn.innerText='রেজিস্ট্রেশন করুন'; return; }

          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;
          
          await setDoc(doc(db, 'users', user.uid), {
            email: email,
            phone: document.getElementById('regPhone').value,
            district: district,
            thana: thana,
            partnerId: document.getElementById('regPartnerId').value,
            role: 'partner',
            createdAt: serverTimestamp()
          });
          alert("সফলভাবে রেজিস্ট্রেশন হয়েছে!");
          window.location.href = "partner-dashboard.html";
        } else {
          await signInWithEmailAndPassword(auth, email, password);
          window.location.href = "partner-dashboard.html";
        }
      } catch (error) {
        errDiv.innerText = error.message.replace("Firebase: ", "");
        errDiv.style.display = 'block';
        btn.innerHTML = isSignup ? 'রেজিস্ট্রেশন করুন' : 'লগইন করুন';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
