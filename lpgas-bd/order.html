<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অর্ডার করুন — LPGas.bd</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .form-container { background: white; max-width: 500px; margin: 20px auto; padding: 24px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #eee; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; color: #333; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1.5px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #cc0000; }
    
    .location-btn { width: 100%; background: #e6f0fa; color: #0066cc; border: 1px solid #b3d4fc; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .location-btn.success { background: #d4edda; color: #155724; border-color: #c3e6cb; }
    .location-status { font-size: 12px; color: #666; text-align: center; margin-bottom: 15px; display: none; }

    .submit-btn { width: 100%; background: #25D366; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 800; font-size: 16px; cursor: pointer; margin-top: 10px; }
    .back-link { display: inline-block; margin-bottom: 15px; color: #cc0000; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo" style="text-decoration: none; color: white;"><i class="fa-solid fa-fire"></i> LPGas<span>.bd</span></a>
  </header>

  <div class="container" style="margin-top: 20px;">
    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> ফিরে যান</a>
    
    <div class="form-container">
      <h2 style="font-size: 22px; font-weight: 800; color: #222; margin-bottom: 5px;">অর্ডার ফর্ম</h2>
      <p id="partnerNameDisplay" style="color: #666; font-size: 14px; margin-bottom: 20px;">লোড হচ্ছে...</p>

      <form id="orderForm">
        <input type="hidden" id="partnerId" value="">
        <input type="hidden" id="cLat" value="">
        <input type="hidden" id="cLng" value="">
        
        <div class="form-group">
          <label>সিলিন্ডারের সাইজ *</label>
          <select id="cSize" required>
            <option value="12kg">১২ কেজি (12 KG)</option>
            <option value="24kg">২৪ কেজি (24 KG)</option>
            <option value="35kg">৩৫ কেজি (35 KG)</option>
            <option value="5kg">৫.৫ কেজি (5.5 KG)</option>
            <option value="15kg">১৫ কেজি (15 KG)</option>
            <option value="25kg">২৫ কেজি (25 KG)</option>
          </select>
        </div>

        <div class="form-group">
          <label>কতটি লাগবে? *</label>
          <input type="number" id="cQuantity" value="1" min="1" required>
        </div>

        <div class="form-group">
          <label>আপনার নাম *</label>
          <input type="text" id="cName" placeholder="আপনার নাম লিখুন" required>
        </div>

        <div class="form-group">
          <label>মোবাইল নাম্বার *</label>
          <input type="tel" id="cPhone" placeholder="01XXXXXXXXX" required>
        </div>

        <div class="form-group">
          <label>ডেলিভারি ঠিকানা *</label>
          <textarea id="cAddress" rows="2" placeholder="বাসা নং, রোড নং, এলাকা" required></textarea>
        </div>

        <!-- লোকেশন বাধ্যতামূলক অপশন -->
        <div class="form-group" style="background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px dashed #ccc;">
          <label style="color: #cc0000;"><i class="fa-solid fa-location-dot"></i> আপনার লোকেশন শেয়ার করুন *</label>
          <p style="font-size: 12px; color: #666; margin-bottom: 10px;">ডেলিভারি ম্যান যাতে সহজে আপনার বাসা খুঁজে পায়।</p>
          <button type="button" class="location-btn" id="locBtn" onclick="getLocation()">
            <i class="fa-solid fa-location-crosshairs"></i> লোকেশন নিন
          </button>
          <div class="location-status" id="locStatus">লোকেশন শেয়ার করা হয়েছে!</div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <i class="fa-solid fa-check-circle"></i> অর্ডার কনফার্ম করুন
        </button>
      </form>
    </div>
  </div>

  <script type="module">
    import { db } from './assets/js/firebase-config.js';
    import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const urlParams = new URLSearchParams(window.location.search);
    const partnerId = urlParams.get('partnerId');

    if (!partnerId) {
      alert("ভুল লিংক!"); window.location.href = "index.html";
    }

    document.getElementById('partnerId').value = partnerId;
    
    const demoDealers = { '1': "Omera LPG (Gulshan)", '2': "LPG Shop BD (Mirpur)", '3': "Shatota LPG" };
    document.getElementById('partnerNameDisplay').innerText = `অর্ডার করছেন: ${demoDealers[partnerId] || 'পার্টনার'}`;

    let locationCaptured = false;

    // লোকেশন নেওয়ার ফাংশন
    window.getLocation = function() {
      const btn = document.getElementById('locBtn');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> খোঁজা হচ্ছে...';
      
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            document.getElementById('cLat').value = position.coords.latitude;
            document.getElementById('cLng').value = position.coords.longitude;
            locationCaptured = true;
            
            btn.classList.add('success');
            btn.innerHTML = '<i class="fa-solid fa-check"></i> লোকেশন যুক্ত হয়েছে';
            document.getElementById('locStatus').style.display = 'block';
          },
          (error) => {
            alert("লোকেশন পাওয়া যায়নি। দয়া করে ফোনের GPS চালু করে পারমিশন দিন।");
            btn.innerHTML = '<i class="fa-solid fa-location-crosshairs"></i> আবার চেষ্টা করুন';
          }
        );
      } else {
        alert("আপনার ব্রাউজার লোকেশন সাপোর্ট করে না।");
      }
    };

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!locationCaptured) {
        alert("অর্ডার করতে হলে অবশ্যই 'লোকেশন নিন' বাটনে ক্লিক করে লোকেশন শেয়ার করতে হবে!");
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> প্রসেস হচ্ছে...';
      btn.disabled = true;

      const orderData = {
        partnerId: partnerId,
        customerName: document.getElementById('cName').value,
        customerPhone: document.getElementById('cPhone').value,
        customerAddress: document.getElementById('cAddress').value,
        cylinderSize: document.getElementById('cSize').value,
        quantity: Number(document.getElementById('cQuantity').value),
        lat: document.getElementById('cLat').value,
        lng: document.getElementById('cLng').value,
        status: 'pending', 
        createdAt: serverTimestamp()
      };

      try {
        await addDoc(collection(db, 'orders'), orderData);
        alert('আপনার অর্ডার সফলভাবে জমা হয়েছে! পার্টনার শীঘ্রই আপনাকে কল দিবে।');
        window.location.href = "index.html";
      } catch (error) {
        alert('দুঃখিত, অর্ডার সেভ করা যায়নি। আবার চেষ্টা করুন।');
        btn.innerHTML = '<i class="fa-solid fa-check-circle"></i> অর্ডার কনফার্ম করুন';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
