<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — LPGas.bd</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .logout-btn { background: white; color: #cc0000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .dash-tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 20px; }
    .dash-tab { padding: 10px 20px; cursor: pointer; font-weight: 700; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .dash-tab.active { color: #cc0000; border-bottom-color: #cc0000; }
    
    .admin-card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #cc0000; }
    .partner-card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #0066cc; }
    .btn-delete { background: #d9534f; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 12px; margin-top: 10px;}
    .brand-tag { display: inline-block; background: #f0f4f8; padding: 3px 8px; border-radius: 4px; font-size: 11px; margin: 2px; color: #333; }
  </style>
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo" style="text-decoration: none; color: white;"><i class="fa-solid fa-fire"></i> LPGas<span>.bd</span> Admin</a>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </header>

  <div class="container" style="margin-top: 20px;">
    <div class="dash-tabs">
      <div class="dash-tab active" onclick="switchTab('orders')">All Orders</div>
      <div class="dash-tab" onclick="switchTab('partners')">Partners List</div>
    </div>

    <div id="tab-orders"><div id="allOrdersList"><p style="text-align:center;">লোড হচ্ছে...</p></div></div>
    <div id="tab-partners" style="display: none;"><div id="allPartnersList"><p style="text-align:center;">লোড হচ্ছে...</p></div></div>
  </div>

  <script type="module">
    import { auth, db } from './assets/js/firebase-config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, getDocs, query, orderBy, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    onAuthStateChanged(auth, (user) => {
      if (!user) { window.location.href = "partner-login.html"; } 
      else { loadAllOrders(); loadAllPartners(); }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await signOut(auth); window.location.href = "partner-login.html";
    });

    window.switchTab = function(tab) {
      document.querySelectorAll('.dash-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.dash-tab')[tab === 'orders' ? 0 : 1].classList.add('active');
      document.getElementById('tab-orders').style.display = tab === 'orders' ? 'block' : 'none';
      document.getElementById('tab-partners').style.display = tab === 'partners' ? 'block' : 'none';
    };

    async function loadAllOrders() {
      const listEl = document.getElementById('allOrdersList');
      try {
        const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
        const snapshot = await getDocs(q);
        listEl.innerHTML = snapshot.docs.map(docSnap => {
          const order = docSnap.data();
          return `
            <div class="admin-card">
              <p><strong>কাস্টমার:</strong> ${order.customerName} (${order.customerPhone})</p>
              <p><strong>ঠিকানা:</strong> ${order.customerAddress}</p>
              <p><strong>অর্ডার:</strong> ${order.brand} - ${order.cylinderSize} | <strong>দাম:</strong> ৳ ${order.price}</p>
              <p><strong>পার্টনার আইডি:</strong> ${order.partnerId} | <strong>স্ট্যাটাস:</strong> ${order.status}</p>
            </div>`;
        }).join('');
      } catch (error) { listEl.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`; }
    }

    async function loadAllPartners() {
      const listEl = document.getElementById('allPartnersList');
      try {
        const snapshot = await getDocs(collection(db, "users"));
        listEl.innerHTML = snapshot.docs.map(docSnap => {
          const p = docSnap.data();
          
          let brandsHtml = '';
          if(p.brands && p.brands.length > 0) {
            brandsHtml = p.brands.map(b => `<span class="brand-tag">${b.name} (১২কেজি: ৳${b.price12 || '-'})</span>`).join('');
          } else {
            brandsHtml = '<span style="font-size:12px; color:#888;">No brands added</span>';
          }

          return `
            <div class="partner-card">
              <p><strong>${p.shopName || 'No Name'}</strong> (Partner ID: ${p.partnerId || 'N/A'})</p>
              <p style="font-size:13px; color:#555; margin: 5px 0;">📍 ${p.thana || 'N/A'}, ${p.district || 'N/A'} | 📞 ${p.phone || 'No phone'}</p>
              <div style="margin-top: 10px;">${brandsHtml}</div>
              <button class="btn-delete" onclick="deletePartner('${docSnap.id}')"><i class="fa-solid fa-trash"></i> Delete Partner</button>
            </div>`;
        }).join('');
      } catch (error) { listEl.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`; }
    }

    window.deletePartner = async function(docId) {
      if(!confirm("আপনি কি নিশ্চিত এই পার্টনারকে ডিলিট করতে চান?")) return;
      try {
        await deleteDoc(doc(db, "users", docId));
        alert("ডিলিট হয়েছে!"); loadAllPartners();
      } catch (error) { alert("সমস্যা: " + error.message); }
    };
  </script>
</body>
</html>
