<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — LPGas.bd</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .logout-btn { background: white; color: #cc0000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .dash-tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 20px; }
    .dash-tab { padding: 10px 20px; cursor: pointer; font-weight: 700; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .dash-tab.active { color: #cc0000; border-bottom-color: #cc0000; }
    
    .admin-card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #cc0000; }
    .partner-card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #0066cc; display: flex; justify-content: space-between; align-items: center; }
    .btn-edit { background: #f0ad4e; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 12px; }
    .btn-delete { background: #d9534f; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 12px; margin-left: 5px; }
    
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: white; border-radius: 12px; padding: 24px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-weight: 700; font-size: 12px; margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
    .btn-save { background: #25D366; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 700; width: 100%; cursor: pointer; }
    
    .brand-item { display: flex; gap: 5px; margin-bottom: 5px; }
    .brand-item input { flex: 1; padding: 5px; font-size: 12px; }
  </style>
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo" style="text-decoration: none; color: white;"><i class="fa-solid fa-fire"></i> LPGas<span>.bd</span> Admin</a>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </header>

  <div class="container" style="margin-top: 20px;">
    <div class="dash-tabs">
      <div class="dash-tab active" onclick="switchTab('orders')">All Orders</div>
      <div class="dash-tab" onclick="switchTab('partners')">Partners List</div>
    </div>

    <div id="tab-orders"><div id="allOrdersList"><p style="text-align:center;">লোড হচ্ছে...</p></div></div>
    <div id="tab-partners" style="display: none;"><div id="allPartnersList"><p style="text-align:center;">লোড হচ্ছে...</p></div></div>
  </div>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <h3 style="margin-bottom: 15px; color: #cc0000;">Edit Partner</h3>
      <input type="hidden" id="editDocId">
      <div class="form-group"><label>Shop Name</label><input id="editShopName" type="text"></div>
      <div class="form-group"><label>Partner ID</label><input id="editPartnerId" type="text"></div>
      <div class="form-group"><label>Phone</label><input id="editPhone" type="text"></div>
      <div class="form-group"><label>Area</label><input id="editAddress" type="text"></div>
      
      <p style="font-size:13px; font-weight:700; margin-top:15px; margin-bottom:5px;">Brands & Prices (JSON)</p>
      <p style="font-size:11px; color:#888; margin-bottom:5px;">Format: [{"name":"Omera", "price12":2200, "price25":4200}]</p>
      <div class="form-group"><textarea id="editBrandsJson" rows="3" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:6px; font-family:monospace;"></textarea></div>
      
      <button class="btn-save" onclick="savePartnerEdit()">Save Changes</button>
      <button onclick="closeModal()" style="width:100%; margin-top:10px; background:none; border:none; color:#888; cursor:pointer;">Cancel</button>
    </div>
  </div>

  <script type="module">
    import { auth, db } from './assets/js/firebase-config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, getDocs, query, orderBy, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    onAuthStateChanged(auth, (user) => {
      if (!user) { window.location.href = "partner-login.html"; } 
      else { loadAllOrders(); loadAllPartners(); }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await signOut(auth); window.location.href = "partner-login.html";
    });

    window.switchTab = function(tab) {
      document.querySelectorAll('.dash-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.dash-tab')[tab === 'orders' ? 0 : 1].classList.add('active');
      document.getElementById('tab-orders').style.display = tab === 'orders' ? 'block' : 'none';
      document.getElementById('tab-partners').style.display = tab === 'partners' ? 'block' : 'none';
    };

    async function loadAllOrders() {
      const listEl = document.getElementById('allOrdersList');
      try {
        const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
        const snapshot = await getDocs(q);
        listEl.innerHTML = snapshot.docs.map(docSnap => {
          const order = docSnap.data();
          return `
            <div class="admin-card">
              <p><strong>কাস্টমার:</strong> ${order.customerName} (${order.customerPhone})</p>
              <p><strong>ঠিকানা:</strong> ${order.customerAddress}</p>
              <p><strong>অর্ডার:</strong> ${order.brand} - ${order.cylinderSize}</p>
            </div>`;
        }).join('');
      } catch (error) { listEl.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`; }
    }

    async function loadAllPartners() {
      const listEl = document.getElementById('allPartnersList');
      try {
        const snapshot = await getDocs(collection(db, "users"));
        listEl.innerHTML = snapshot.docs.map(docSnap => {
          const p = docSnap.data();
          let brandsText = p.brands ? p.brands.map(b => b.name).join(', ') : 'None';
          return `
            <div class="partner-card">
              <div>
                <p><strong>${p.shopName || 'No Name'}</strong> (ID: ${p.partnerId || 'N/A'})</p>
                <p style="font-size:12px; color:#666;">Brands: ${brandsText}</p>
              </div>
              <div>
                <button class="btn-edit" onclick="openEditModal('${docSnap.id}')">Edit</button>
                <button class="btn-delete" onclick="deletePartner('${docSnap.id}')"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>`;
        }).join('');
      } catch (error) { listEl.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`; }
    }

    window.openEditModal = async function(docId) {
      document.getElementById('editDocId').value = docId;
      const docSnap = await getDocs(query(collection(db, "users"))); // Fetch all to find, or use getDoc
      // Get specific doc
      const { getDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
      const p = (await getDoc(doc(db, "users", docId))).data();
      
      document.getElementById('editShopName').value = p.shopName || '';
      document.getElementById('editPartnerId').value = p.partnerId || '';
      document.getElementById('editPhone').value = p.phone || '';
      document.getElementById('editAddress').value = p.address || '';
      document.getElementById('editBrandsJson').value = JSON.stringify(p.brands || [], null, 2);
      
      document.getElementById('editModal').classList.add('active');
    };

    window.closeModal = function() { document.getElementById('editModal').classList.remove('active'); };

    window.savePartnerEdit = async function() {
      const docId = document.getElementById('editDocId').value;
      try {
        let brandsData = [];
        try {
          brandsData = JSON.parse(document.getElementById('editBrandsJson').value);
        } catch(e) {
          alert("JSON ফরম্যাট ভুল আছে!"); return;
        }

        await updateDoc(doc(db, "users", docId), {
          partnerId: document.getElementById('editPartnerId').value,
          shopName: document.getElementById('editShopName').value,
          phone: document.getElementById('editPhone').value,
          address: document.getElementById('editAddress').value,
          brands: brandsData
        });
        alert("সফলভাবে আপডেট হয়েছে!");
        closeModal(); loadAllPartners();
      } catch (error) { alert("সমস্যা: " + error.message); }
    };

    window.deletePartner = async function(docId) {
      if(!confirm("ডিলিট করতে চান?")) return;
      try {
        await deleteDoc(doc(db, "users", docId));
        alert("ডিলিট হয়েছে!"); loadAllPartners();
      } catch (error) { alert("সমস্যা: " + error.message); }
    };
  </script>
</body>
</html>
