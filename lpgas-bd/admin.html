<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — LPGas.bd</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .logout-btn { background: white; color: #cc0000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .dash-tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 20px; }
    .dash-tab { padding: 10px 20px; cursor: pointer; font-weight: 700; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .dash-tab.active { color: #cc0000; border-bottom-color: #cc0000; }
    
    /* Orders */
    .admin-card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #cc0000; }
    .admin-header { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
    .status-badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .status-pending { background: #fff3cd; color: #856404; }
    .status-delivered { background: #d4edda; color: #155724; }
    
    /* Partners */
    .partner-card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #0066cc; display: flex; justify-content: space-between; align-items: center; }
    .partner-card p { font-size: 14px; margin-bottom: 5px; color: #333; }
    .btn-edit { background: #f0ad4e; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 12px; }
    .btn-delete { background: #d9534f; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 12px; margin-left: 5px; }
    
    /* Edit Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: white; border-radius: 12px; padding: 24px; width: 100%; max-width: 400px; position: relative; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: 700; font-size: 13px; margin-bottom: 5px; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; outline: none; }
    .btn-save { background: #25D366; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 700; width: 100%; cursor: pointer; }
  </style>
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo" style="text-decoration: none; color: white;"><i class="fa-solid fa-fire"></i> LPGas<span>.bd</span> Admin</a>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </header>

  <div class="container" style="margin-top: 20px;">
    <div class="dash-tabs">
      <div class="dash-tab active" onclick="switchTab('orders')">All Orders</div>
      <div class="dash-tab" onclick="switchTab('partners')">Partners List</div>
    </div>

    <!-- Orders Tab -->
    <div id="tab-orders">
      <div id="allOrdersList"><p style="text-align:center; color:#888;">লোড হচ্ছে...</p></div>
    </div>

    <!-- Partners Tab -->
    <div id="tab-partners" style="display: none;">
      <div id="allPartnersList"><p style="text-align:center; color:#888;">লোড হচ্ছে...</p></div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <h3 style="margin-bottom: 15px; color: #cc0000;">Edit Partner</h3>
      <input type="hidden" id="editDocId">
      <div class="form-group"><label>Partner ID (e.g. 1)</label><input id="editPartnerId" type="text"></div>
      <div class="form-group"><label>Phone Number</label><input id="editPhone" type="text"></div>
      <div class="form-group"><label>Area / Address</label><input id="editAddress" type="text"></div>
      <button class="btn-save" onclick="savePartnerEdit()">Save Changes</button>
      <button onclick="closeModal()" style="width:100%; margin-top:10px; background:none; border:none; color:#888; cursor:pointer;">Cancel</button>
    </div>
  </div>

  <script type="module">
    import { auth, db } from './assets/js/firebase-config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, getDocs, query, orderBy, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    onAuthStateChanged(auth, (user) => {
      if (!user) { window.location.href = "partner-login.html"; } 
      else { loadAllOrders(); loadAllPartners(); }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = "partner-login.html";
    });

    // ট্যাব পরিবর্তন
    window.switchTab = function(tab) {
      document.querySelectorAll('.dash-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.dash-tab')[tab === 'orders' ? 0 : 1].classList.add('active');
      document.getElementById('tab-orders').style.display = tab === 'orders' ? 'block' : 'none';
      document.getElementById('tab-partners').style.display = tab === 'partners' ? 'block' : 'none';
    };

    // অর্ডার লোড
    async function loadAllOrders() {
      const listEl = document.getElementById('allOrdersList');
      try {
        const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
        const snapshot = await getDocs(q);
        if (snapshot.empty) { listEl.innerHTML = '<p style="text-align:center;">কোনো অর্ডার নেই।</p>'; return; }
        listEl.innerHTML = snapshot.docs.map(docSnap => {
          const order = docSnap.data();
          const statusClass = order.status === 'delivered' ? 'status-delivered' : 'status-pending';
          return `
            <div class="admin-card">
              <div class="admin-header">
                <span style="font-weight:700;">অর্ডার: ${docSnap.id.slice(0, 6)}...</span>
                <span class="status-badge ${statusClass}">${order.status}</span>
              </div>
              <p><strong>কাস্টমার:</strong> ${order.customerName} (${order.customerPhone})</p>
              <p><strong>ঠিকানা:</strong> ${order.customerAddress}</p>
              <p><strong>পার্টনার আইডি:</strong> ${order.partnerId} | <strong>গ্যাস:</strong> ${order.cylinderSize}</p>
            </div>`;
        }).join('');
      } catch (error) { listEl.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`; }
    }

    // পার্টনার লোড
    async function loadAllPartners() {
      const listEl = document.getElementById('allPartnersList');
      try {
        const snapshot = await getDocs(collection(db, "users"));
        listEl.innerHTML = snapshot.docs.map(docSnap => {
          const p = docSnap.data();
          return `
            <div class="partner-card">
              <div>
                <p><strong>ID:</strong> ${docSnap.id.slice(0,8)}... | <strong>Partner ID:</strong> ${p.partnerId || 'N/A'}</p>
                <p><strong>Phone:</strong> ${p.phone || 'Not set'} | <strong>Area:</strong> ${p.address || 'Not set'}</p>
              </div>
              <div>
                <button class="btn-edit" onclick="openEditModal('${docSnap.id}', '${p.partnerId || ''}', '${p.phone || ''}', '${p.address || ''}')"><i class="fa-solid fa-pen"></i></button>
                <button class="btn-delete" onclick="deletePartner('${docSnap.id}')"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>`;
        }).join('');
      } catch (error) { listEl.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`; }
    }

    // এডিট মোডাল
    window.openEditModal = function(docId, partnerId, phone, address) {
      document.getElementById('editDocId').value = docId;
      document.getElementById('editPartnerId').value = partnerId;
      document.getElementById('editPhone').value = phone;
      document.getElementById('editAddress').value = address;
      document.getElementById('editModal').classList.add('active');
    };

    window.closeModal = function() { document.getElementById('editModal').classList.remove('active'); };

    // পার্টনার এডিট সেভ
    window.savePartnerEdit = async function() {
      const docId = document.getElementById('editDocId').value;
      const partnerId = document.getElementById('editPartnerId').value;
      const phone = document.getElementById('editPhone').value;
      const address = document.getElementById('editAddress').value;

      try {
        const partnerRef = doc(db, "users", docId);
        await updateDoc(partnerRef, { partnerId: partnerId, phone: phone, address: address });
        alert("সফলভাবে আপডেট হয়েছে!");
        closeModal();
        loadAllPartners();
      } catch (error) { alert("সমস্যা: " + error.message); }
    };

    // পার্টনার ডিলিট
    window.deletePartner = async function(docId) {
      if(!confirm("আপনি কি নিশ্চিত এই পার্টনারকে ডিলিট করতে চান?")) return;
      try {
        await deleteDoc(doc(db, "users", docId));
        alert("পার্টনার ডিলিট হয়েছে!");
        loadAllPartners();
      } catch (error) { alert("সমস্যা: " + error.message); }
    };
  </script>
</body>
</html>
