  <script type="module">
    import { auth, db } from './assets/js/firebase-config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, query, orderBy, getDocs, doc, getDoc, updateDoc, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    let currentUser = null;
    let myPartnerId = null; // এই পার্টনারের আইডি

    // লগইন স্টেট চেক
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "partner-login.html"; 
      } else {
        currentUser = user;
        await getPartnerIdAndLoadOrders(); // পার্টনারের আইডি খুঁজে বের করে অর্ডার আনবে
      }
    });

    // পার্টনারের আইডি বের করা
    async function getPartnerIdAndLoadOrders() {
      const listEl = document.getElementById('ordersList');
      listEl.innerHTML = '<p style="text-align:center; color:#888;">লোড হচ্ছে...</p>';

      try {
        // ১. 'users' কালেকশন থেকে এই লগইন করা ইউজারের প্রোফাইল বের করা
        const userDocRef = doc(db, 'users', currentUser.uid);
        const userDocSnap = await getDoc(userDocRef);

        if (userDocSnap.exists() && userDocSnap.data().partnerId) {
          myPartnerId = userDocSnap.data().partnerId; // পার্টনার আইডি পেয়ে গেছি (যেমন: "1")
        } else {
          listEl.innerHTML = '<p style="text-align:center; color:red;">আপনার অ্যাকাউন্টের সাথে কোনো পার্টনার আইডি যুক্ত নেই। অ্যাডমিনের সাথে যোগাযোগ করুন।</p>';
          return;
        }

        // ২. এখন শুধু এই পার্টনারের অর্ডারগুলো খুঁজবো (where ফিল্টার ব্যবহার করে)
        const q = query(
          collection(db, "orders"), 
          where("partnerId", "==", myPartnerId), 
          orderBy("createdAt", "desc")
        );
        
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          listEl.innerHTML = '<p style="text-align:center; color:#888;">আপনার জন্য এখনো কোনো নতুন অর্ডার আসেনি।</p>';
          return;
        }

        // অর্ডারগুলো স্ক্রিনে দেখানো
        listEl.innerHTML = querySnapshot.docs.map(docSnap => {
          const order = docSnap.data();
          const orderId = docSnap.id;
          const date = order.createdAt ? order.createdAt.toDate().toLocaleString() : 'N/A';
          
          return `
            <div class="order-card">
              <div class="order-header">
                <span class="order-id">ID: ${orderId.slice(0, 6)}...</span>
                <span class="order-status">${order.status.toUpperCase()}</span>
              </div>
              <div class="order-details">
                <p><strong>নাম:</strong> ${order.customerName}</p>
                <p><strong>ফোন:</strong> ${order.customerPhone}</p>
                <p><strong>ঠিকানা:</strong> ${order.customerAddress}</p>
                <p><strong>সিলিন্ডার:</strong> ${order.cylinderSize} (${order.quantity} পিস)</p>
                <p style="font-size:12px; color:#888; margin-top:5px;">সময়: ${date}</p>
              </div>
              <div class="action-btns">
                <a href="tel:${order.customerPhone}" class="btn-call"><i class="fa-solid fa-phone"></i> Call</a>
                ${order.status === 'pending' 
                  ? `<button class="btn-done" onclick="markDelivered('${orderId}')"><i class="fa-solid fa-check"></i> Delivered</button>` 
                  : ''}
              </div>
            </div>
          `;
        }).join('');

      } catch (error) {
        console.error(error);
        listEl.innerHTML = `<p style="text-align:center; color:red;">অর্ডার লোড করতে সমস্যা হয়েছে। (সম্ভবত Index তৈরি হতে হবে, ব্রাউজারের Console চেক করুন)</p>`;
      }
    }

    // লগআউট
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = "partner-login.html";
    });

    // অর্ডার ডেলিভারি সম্পন্ন মার্ক করা
    window.markDelivered = async function(orderId) {
      if(!confirm("আপনি কি নিশ্চিত এই অর্ডারটি ডেলিভারি সম্পন্ন হয়েছে?")) return;
      
      try {
        const orderRef = doc(db, "orders", orderId);
        await updateDoc(orderRef, {
          status: "delivered",
          deliveredAt: new Date()
        });
        alert("অর্ডার সফলভাবে ডেলিভারি হয়েছে!");
        getPartnerIdAndLoadOrders(); // ড্যাশবোর্ড রিফ্রেশ
      } catch (error) {
        alert("আপডেট করতে সমস্যা হয়েছে: " + error.message);
      }
    };
  </script>
